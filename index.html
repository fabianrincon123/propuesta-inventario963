<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de equipos · Bodega 963 · Bg360</title>
<style>
:root{
  --bg:#0f1923;--panel:#111c26;--card:#131f2b;--card2:#0c151e;--line:#1e2d3d;--hover:#162030;
  --txt:#e0e0e0;--mut:#8a9db0;--mut2:#6b7f8e;--dim:#4a6070;
  --acc:#00d4a8;--acc-bg:rgba(0,212,168,.12);
  --ok:#22c55e;--ok-bg:rgba(34,197,94,.13);
  --warn:#f5a623;--warn-bg:rgba(245,166,35,.13);
  --err:#ef4444;--err-bg:rgba(239,68,68,.13);
  --info:#3b9eff;--info-bg:rgba(59,158,255,.13);
  --vio:#a78bfa;--vio-bg:rgba(167,139,250,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:var(--txt);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--acc);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
.ic{width:15px;height:15px;flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
.mut{color:var(--mut2)}
.dash{color:var(--dim)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#223446;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.erp-shell{display:flex;height:100vh}
.sidebar{width:180px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.logo{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.logo b{font-size:17px;color:#fff;letter-spacing:.2px}
.logo b span{color:var(--acc)}
.logo small{display:block;font-size:10px;color:var(--dim);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:6px 0}
.nav-sec{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);padding:14px 16px 6px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12.5px;color:var(--mut);cursor:pointer;border-left:2px solid transparent}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--hover);color:var(--acc);border-left-color:var(--acc)}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:center}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--acc);color:#0f1923;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.side-foot .nm{font-size:11.5px;line-height:1.25}
.side-foot .rl{font-size:10px;color:var(--dim)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:42px;flex:none;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:stretch;padding:0 14px;gap:2px}
.tab{display:flex;align-items:center;gap:7px;padding:0 12px;font-size:12px;color:var(--mut2);cursor:pointer;border-bottom:2px solid transparent;user-select:none;margin-bottom:-1px}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--txt);border-bottom-color:var(--acc)}
.tab .cnt{background:var(--warn-bg);color:var(--warn);font-size:10px;font-weight:700;padding:1px 6px;border-radius:9px}
.crumb{margin-left:auto;align-self:center;font-size:11px;color:var(--dim)}
.crumb b{color:var(--mut);font-weight:500}
.content{flex:1;min-height:0;display:flex;flex-direction:column;padding:14px 18px 10px;gap:10px}

/* ---------- page head ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.ph h1{font-size:17px;font-weight:600;color:#fff}
.ph p{font-size:12px;color:var(--mut2);margin-top:3px}
.ph-act{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--txt);white-space:nowrap}
.btn:hover{border-color:#2b4157;background:var(--hover)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#06231d;font-weight:600}
.btn.primary:hover{background:#00e6b6}
.btn.ghost{background:none}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.btn.ok{border-color:rgba(34,197,94,.4);color:var(--ok)}
.btn.ok:hover{background:var(--ok-bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ib{width:26px;height:26px;display:inline-grid;place-items:center;border-radius:6px;color:var(--mut)}
.ib:hover{background:var(--hover);color:var(--acc)}

/* ---------- chips ---------- */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--mut)}
.chip b{font-size:11px;color:var(--txt);background:#1a2a3a;padding:1px 7px;border-radius:9px}
.chip:hover{border-color:#2b4157}
.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.chip-sep{width:1px;background:var(--line);margin:4px 4px}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.flt{display:flex;flex-direction:column;gap:3px;min-width:118px}
.flt.grow{flex:1;min-width:220px}
.flt>span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
.inp,.flt select,.flt input{height:28px;background:var(--card2);border:1px solid var(--line);border-radius:6px;color:var(--txt);font:inherit;font-size:12px;padding:0 8px;outline:none;width:100%}
.inp:focus,.flt select:focus,.flt input:focus{border-color:var(--acc)}
input[type=date]{color-scheme:dark}
textarea.inp{height:auto;min-height:56px;padding:6px 8px;resize:vertical}
.inp:disabled{opacity:.6}
.srch{position:relative}
.srch .ic{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--dim);width:14px;height:14px}
.srch input{padding-left:28px}
.srch.big input{height:32px}

/* ---------- tables ---------- */
.tw{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th{position:sticky;top:0;z-index:3;background:#142130;color:var(--mut2);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;background:var(--card)}
th.stk{z-index:4}
td.stk{position:sticky;z-index:1}
th.stk,td.stk{overflow:hidden;text-overflow:ellipsis}
.stk-l{box-shadow:inset -1px 0 0 #26394c,6px 0 8px -6px rgba(0,0,0,.6)}
tbody tr{cursor:pointer}
tr.sel td{background:#122a2b}
tbody tr:hover td{background:var(--hover)}
td.r,th.r{text-align:right}
td.desc{max-width:260px;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.dv{font-weight:600;font-size:11.5px}
td.empty{text-align:center;color:var(--mut2);padding:40px;cursor:default}
input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px;cursor:pointer;vertical-align:middle}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px;font-size:11.5px;color:var(--mut2)}
.bulk{display:flex;align-items:center;gap:8px}
.bulk b{color:var(--acc)}
.pdays{font-weight:700}

/* ---------- badges ---------- */
.bd{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:600;white-space:nowrap;line-height:16px}
.bd::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-err{background:var(--err-bg);color:var(--err)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-acc{background:var(--acc-bg);color:var(--acc)}
.b-vio{background:var(--vio-bg);color:var(--vio)}
.b-mut{background:#1a2836;color:var(--mut2)}
.bd.plain::before{display:none}
.sub{font-size:10.5px;color:var(--mut2);margin-left:5px}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(3,8,12,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.open{display:flex}
.ov-det{z-index:70}
.modal{width:min(800px,96vw);max-height:92vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.ov-det .modal{width:min(760px,96vw)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mt{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:#fff}
.mt .ic{color:var(--acc);width:17px;height:17px}
.ms{font-size:11.5px;color:var(--mut2);margin-top:3px}
.x{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;color:var(--mut)}
.x:hover{background:var(--hover);color:#fff}
.mb{padding:4px 18px 18px;overflow-y:auto;flex:1}
.mf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 18px;border-top:1px solid var(--line);font-size:11.5px}
.mf>div{display:flex;gap:8px}
.fsec{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--acc);margin:18px 0 9px;display:flex;align-items:center;gap:8px}
.fsec::after{content:"";flex:1;height:1px;background:var(--line)}
.fsec .mut{text-transform:none;letter-spacing:0}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px 14px}
.fg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f.full{grid-column:1/-1}
.f>label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px}
.f>label i{color:var(--err);font-style:normal}
.f .help{font-size:10.5px;color:var(--dim);margin-top:4px}
.f .err{font-size:10.5px;color:var(--err);margin-top:4px;display:none}
.f.bad .err{display:block}
.f.bad .inp{border-color:var(--err)}
.f.bad .picker{border-color:var(--err)}
.inrow{display:flex;gap:8px;align-items:center}
.ck{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--mut);white-space:nowrap;cursor:pointer}
.calc{font-size:11px;color:var(--mut2);margin-top:4px}
.calc b{color:var(--txt)}
#fbody:not([data-estado="NUEVO"]) [data-for="NUEVO"],#fbody[data-estado="NUEVO"] [data-for="USADO"],#fbody[data-ret] [data-hide-ret]{display:none}
.rq{display:none;color:var(--err);font-style:normal}
#fbody[data-estado="NUEVO"] .rq{display:inline}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card2);flex-wrap:wrap}
.seg button{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;font-size:12px;color:var(--mut);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover:not(:disabled){color:var(--txt);background:var(--hover)}
.seg button.on{background:var(--acc-bg);color:var(--acc);font-weight:600}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg.sm button{padding:5px 11px;font-size:11.5px}
.hint{font-size:11.5px;color:var(--mut2);margin-top:8px;line-height:1.45}

.alert{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:7px;font-size:12px;line-height:1.5;border:1px solid}
.alert .ic{margin-top:2px}
.alert.err{background:var(--err-bg);border-color:rgba(239,68,68,.35);color:#fca5a5}
.alert.info{background:var(--info-bg);border-color:rgba(59,158,255,.35);color:#a9d1ff}
.alert.warn{background:var(--warn-bg);border-color:rgba(245,166,35,.35);color:#fcd38a}
.alert b{color:#fff}
.alert .bd{vertical-align:1px}

/* combo */
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:100%;margin-top:3px;max-height:210px;overflow:auto;background:var(--card2);border:1px solid #2b4157;border-radius:6px;z-index:10;display:none;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.combo.open .combo-list{display:block}
.combo-opt{padding:6px 9px;cursor:pointer;font-size:12px}
.combo-opt:hover,.combo-opt.hl{background:var(--hover);color:var(--acc)}
.combo-empty{padding:8px 9px;font-size:11.5px;color:var(--mut2)}
.combo::after{content:"";position:absolute;right:10px;top:12px;border:4px solid transparent;border-top-color:var(--dim);pointer-events:none}

/* picker */
.picker{border:1px solid var(--line);border-radius:7px;max-height:228px;overflow-y:auto;margin-top:8px;background:var(--card2)}
.pk{display:grid;grid-template-columns:18px 140px 150px 92px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
.pk:last-child{border-bottom:0}
.pk:hover{background:var(--hover)}
.pk.on{background:#122a2b}
.pk.dis{cursor:not-allowed;opacity:.55}
.pk-d{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-x{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-r{font-size:11px;color:var(--mut2);white-space:nowrap;text-align:right}
.pk-more{padding:9px 10px;font-size:11.5px;color:var(--mut2);text-align:center}
.chips-sel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips-sel:empty{display:none}
.cs{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 9px;border-radius:12px;background:var(--acc-bg);color:var(--acc);font-size:11.5px}
.cs button{width:18px;height:18px;display:grid;place-items:center;border-radius:50%}
.cs button:hover{background:rgba(0,212,168,.2)}
.cs .ic{width:11px;height:11px}

/* detail grid */
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kv.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv>div{background:var(--card);padding:8px 10px;min-width:0}
.kv .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:3px}
.kv .v{font-size:12px;word-break:break-word}
.kv .wide{grid-column:1/-1}
.kv .span2{grid-column:span 2}
.audit{list-style:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.audit li{display:grid;grid-template-columns:20px 120px 140px 1fr;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px;background:var(--card)}
.audit li:last-child{border-bottom:0}
.audit .ic{color:var(--acc);width:14px;height:14px}
.audit .t{color:var(--mut2);font-size:11.5px}
.mini{list-style:none;margin-top:10px;border:1px solid var(--line);border-radius:7px;max-height:200px;overflow:auto}
.mini li{padding:6px 10px;border-bottom:1px solid var(--line);font-size:11.5px;display:flex;gap:8px;align-items:center}
.mini li:last-child{border-bottom:0}

/* drawer */
.drw-ov{position:fixed;inset:0;background:rgba(3,8,12,.45);z-index:59;display:none}
.drw-ov.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,96vw);background:var(--panel);border-left:1px solid var(--line);z-index:60;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.45)}
.drawer.open{transform:none}
.dh{display:flex;justify-content:space-between;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--acc);margin-bottom:5px}
.dh h2{font-size:16px;color:#fff;font-weight:600}
.dh p{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.4}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.db{flex:1;overflow-y:auto;padding:4px 18px 24px}
.now{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;line-height:1.5}
.now .ic{width:18px;height:18px;margin-top:1px}
.now.c-info .ic{color:var(--info)}
.now.c-acc .ic{color:var(--acc)}
.now.c-warn .ic{color:var(--warn)}
.now.c-vio .ic{color:var(--vio)}
.now b{color:#fff}
.d-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tl{list-style:none;position:relative;margin-left:6px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 12px 24px;cursor:pointer}
.tl-dot{position:absolute;left:0;top:10px;width:12px;height:12px;border-radius:50%;border:2px solid var(--panel);background:var(--mut2)}
.tl-i.c-info .tl-dot{background:var(--info)}
.tl-i.c-acc .tl-dot{background:var(--acc)}
.tl-i.c-warn .tl-dot{background:var(--warn)}
.tl-i.c-vio .tl-dot{background:var(--vio)}
.tl-b{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--card)}
.tl-i:hover .tl-b{border-color:#2b4157;background:var(--hover)}
.tl-i.first .tl-b{border-color:rgba(0,212,168,.35)}
.tl-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tl-d{font-size:11.5px;font-weight:600;color:#fff;margin-right:2px}
.tl-t{font-size:12.5px;margin-top:6px}
.tl-s{font-size:11.5px;color:var(--mut);margin-top:2px}
.tl-a{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--dim);margin-top:6px}
.tl-a .ic{width:12px;height:12px}

/* toasts */
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{display:flex;gap:9px;align-items:center;min-width:260px;max-width:420px;padding:10px 13px;border-radius:8px;background:#162434;border:1px solid var(--line);border-left:3px solid var(--ok);font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:tin .2s ease}
.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--err)}
.toast .ic{color:var(--ok)}
.toast.warn .ic{color:var(--warn)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
</style>
</head>
<body>
<div class="erp-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="ov" id="ov-form"><div class="modal"></div></div>
<div class="drw-ov" id="drw-ov"></div>
<aside class="drawer" id="drawer"></aside>
<div class="ov ov-det" id="ov-det"><div class="modal"></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoD(d)};
const fF=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`:'';
const fCOP=n=>n==null||n===''||isNaN(n)?'':'$'+Math.round(n).toLocaleString('es-CO');
const dias=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const nowTs=()=>{const d=new Date();return `${isoD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const normK=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,'');

function nuevoEquipo(o){
  const e={id:nE++,dispositivo:o.dispositivo,descripcion:o.descripcion,serial:o.serial||'',activo:o.activo||'',estado:o.estado,
    proveedor:o.proveedor||'',nit:o.nit||'',fechaFactura:o.fechaFactura||'',numFactura:o.numFactura||'',valor:o.valor??null,
    fechaIngreso:'',repisa:'',situacion:'BODEGA',usuario:'',ccAsignado:'',fechaEnvio:'',ultMov:null};
  e.cod='EQ-'+String(e.id).padStart(4,'0');
  equipos.push(e);return e;
}
function registrarMov(e,m,opt={}){
  const mv={id:nM++,equipoId:e.id,fecha:m.fecha,seguimiento:m.seguimiento,origen:m.origen||'',estado:'',repisa:'',
    usuario:'',ccAsignado:'',fechaEnvio:'',traslado:m.traslado,audit:[]};
  if(m.seguimiento==='INGRESO'){
    if(m.origen==='RETORNO')e.estado='USADO';
    mv.repisa=m.repisa;
    Object.assign(e,{situacion:'BODEGA',fechaIngreso:m.fecha,repisa:m.repisa,usuario:'',ccAsignado:'',fechaEnvio:''});
  }else{
    Object.assign(mv,{repisa:e.repisa,usuario:m.usuario,ccAsignado:m.ccAsignado,fechaEnvio:m.fechaEnvio});
    Object.assign(e,{situacion:sitDeSeg(m.seguimiento),usuario:m.usuario,ccAsignado:m.ccAsignado,fechaEnvio:m.fechaEnvio,repisa:''});
  }
  mv.estado=e.estado;
  const tipo=m.origen==='RETORNO'?' (retorno a bodega)':'';
  mv.audit.push({ts:opt.ts||nowTs(),por:opt.por||USUARIO_ACTUAL,acc:`Registró el movimiento ${m.seguimiento}${tipo}`,i:'edit'});
  movs.push(mv);e.ultMov=mv.id;return mv;
}
function marcarTraslados(ids){
  let n=0;
  ids.forEach(id=>{const m=movById(id);if(m&&m.traslado==='NO REALIZADO'){m.traslado='REALIZADO';m.audit.push({ts:nowTs(),por:USUARIO_ACTUAL,acc:'Marcó el traslado como REALIZADO en el ERP',i:'check'});n++}});
  ['inv','hist','tras'].forEach(k=>ui[k+'Sel'].clear());
  return n;
}

function seed(){
  let k=0;
  const ts=f=>{k++;return `${f} ${pad(7+(k*5)%10)}:${pad((k*17)%60)}`};
  for(const [b,evs] of SEED){
    let e=null;
    for(const ev of evs){
      let mv;
      if(ev[0]==='C'){
        const [,f,rep,prov,ff,nf,val]=ev;const p=PROV.find(x=>x.n===prov);
        e=nuevoEquipo({dispositivo:b[0],descripcion:b[1],serial:b[2],activo:b[3],estado:'NUEVO',proveedor:p.n,nit:p.nit,fechaFactura:ff,numFactura:nf,valor:val});
        mv=registrarMov(e,{fecha:f,seguimiento:'INGRESO',origen:'ALTA',repisa:rep,traslado:'NO APLICA'},{ts:ts(f)});
      }else if(ev[0]==='R'){
        const [,f,rep,tr]=ev;
        const ret=!!e;
        if(!e)e=nuevoEquipo({dispositivo:b[0],descripcion:b[1],serial:b[2],activo:b[3],estado:'USADO'});
        mv=registrarMov(e,{fecha:f,seguimiento:'INGRESO',origen:ret?'RETORNO':'ALTA',repisa:rep,traslado:tr},{ts:ts(f)});
      }else{
        const [,f,seg,us,cc,fe,tr]=ev;
        mv=registrarMov(e,{fecha:f,seguimiento:seg,usuario:us,ccAsignado:cc,fechaEnvio:fe,traslado:tr},{ts:ts(f)});
      }
      if(mv.traslado==='REALIZADO')mv.audit.push({ts:`${mv.fechaEnvio||mv.fecha} 16:${pad((k*7)%60)}`,por:USUARIO_ACTUAL,acc:'Marcó el traslado como REALIZADO en el ERP',i:'check'});
    }
  }
}

function openModal(w,html){const ov=$('#ov-'+w);ov.querySelector('.modal').innerHTML=html;ov.classList.add('open')}
function closeModal(w){$('#ov-'+w).classList.remove('open')}
function toast(msg,t='ok'){const d=document.createElement('div');d.className='toast '+t;d.innerHTML=ic(t==='ok'?'check':'warn')+`<div>${msg}</div>`;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),3600)}

const fld=(label,inner,o={})=>`<div class="f ${o.cls||''}" ${o.id?`id="${o.id}"`:''} ${o.only?`data-only="${o.only}"`:''}><label>${label}${o.req?' <i>*</i>':''}</label>${inner}${o.help?`<div class="help">${o.help}</div>`:''}<div class="err"></div></div>`;
const mkCombo=(id,ph)=>`<div class="combo"><input class="inp" id="${id}" autocomplete="off" placeholder="${ph}"><div class="combo-list"></div></div>`;
const selH=(id,opts,ph)=>`<select class="inp" id="${id}">${ph?`<option value="">${ph}</option>`:''}${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
function err(id,msg){const f=$('#'+id).closest('.f');f.classList.add('bad');f.querySelector('.err').textContent=msg}
function clearErrs(){$$('#ov-form .f.bad').forEach(f=>f.classList.remove('bad'))}
function vFecha(x,min,max){if(!x)return 'Obligatorio';if(x<min)return `Fecha fuera de rango: anterior al ${fF(min)}`;if(x>max)return `Fecha fuera de rango: posterior al ${fF(max)}`;return ''}
function focusErr(){const b=$('#ov-form .f.bad');if(b)b.scrollIntoView({block:'center',behavior:'smooth'})}

/* lista desplegable con búsqueda: solo acepta valores del catálogo */
function bindCombo(id,getOpts,onPick){
  const inp=$('#'+id),wrap=inp.parentElement,list=wrap.querySelector('.combo-list');let hl=-1,cur=[];
  const draw=()=>{const q=inp.value.trim().toLowerCase();cur=getOpts().filter(o=>o.toLowerCase().includes(q)).slice(0,120);hl=-1;
    list.innerHTML=cur.length?cur.map((o,i)=>`<div class="combo-opt" data-i="${i}">${esc(o)}</div>`).join(''):'<div class="combo-empty">Sin coincidencias en el catálogo</div>';wrap.classList.add('open')};
  const pick=x=>{inp.value=x;wrap.classList.remove('open');inp.closest('.f')?.classList.remove('bad');onPick&&onPick(x)};
  inp.addEventListener('focus',draw);
  inp.addEventListener('input',()=>{draw();inp.closest('.f')?.classList.remove('bad')});
  inp.addEventListener('keydown',ev=>{
    if(!wrap.classList.contains('open'))return;
    const items=$$('.combo-opt',list);
    if(ev.key==='ArrowDown')hl=Math.min(hl+1,items.length-1);
    else if(ev.key==='ArrowUp')hl=Math.max(hl-1,0);
    else if(ev.key==='Enter'){ev.preventDefault();if(hl>=0)pick(cur[hl]);else if(cur.length===1)pick(cur[0]);return}
    else if(ev.key==='Escape'){ev.stopPropagation();wrap.classList.remove('open');return}
    else return;
    ev.preventDefault();items.forEach((x,i)=>x.classList.toggle('hl',i===hl));items[hl]?.scrollIntoView({block:'nearest'});
  });
  list.addEventListener('mousedown',ev=>{const o=ev.target.closest('.combo-opt');if(o){ev.preventDefault();pick(cur[+o.dataset.i])}});
  inp.addEventListener('blur',()=>setTimeout(()=>{wrap.classList.remove('open');
    const t=inp.value.trim().toUpperCase().replace(/\s+/g,' ');const exact=getOpts().find(o=>o.toUpperCase()===t);
    if(exact){if(exact!==inp.value)inp.value=exact;onPick&&onPick(exact)}},130));
}

let F={};

  const r=opt.retornoDe?eqById(opt.retornoDe):null;
  F={kind:'ing',retorno:r,match:null,matchBy:'',locked:false};
  openModal('form',`

    <div class="fg">
      ${fld('Fecha de ingreso',`<input type="date" class="inp" id="i_fecha" value="${HOY}" min="${MIN_FECHA}" max="${HOY}">`,{req:1})}
      ${fld('Estado',selH('i_estado',['NUEVO','USADO'],'Seleccionar…'),{req:1})}
      ${fld('Dispositivo',mkCombo('i_disp','Buscar en el catálogo…'),{req:1,cls:'full',help:'Lista cerrada: evita "MOUSE " con espacio, "ROUTERBOAR", etc.'})}
      ${fld('Descripción',`<textarea class="inp" id="i_desc" placeholder="Marca, modelo, características, novedades (ej. FALTA ESPUMA)"></textarea>`,{req:1,cls:'full'})}
      ${fld('Serial',`<div class="inrow"><input class="inp mono" id="i_serial" placeholder="Serial del equipo"><label class="ck"><input type="checkbox" id="i_noserial">Sin serial</label></div>`,{req:1})}
      ${fld('Activo',`<div class="inrow"><input class="inp" id="i_activo" placeholder="N° de activo fijo"><label class="ck"><input type="checkbox" id="i_noactivo">Sin activo</label></div>`,{req:1})}
      <div class="f full" id="i_dup" style="display:none"></div>
      ${fld('Número de repisa',selH('i_repisa',REPISAS,'Seleccionar…'),{req:1})}
      ${fld('Cantidad',`<input type="number" class="inp" id="i_cant" value="1" min="1" max="50">`,{id:'f_cant',help:'Solo para equipos sin serial ni activo. Se crea una unidad por cada uno.'})}
    </div>

    <div class="fsec">Traslado</div>
    <div class="fg">
      <div data-for="NUEVO">${fld('Traslado en el ERP',`<input class="inp" value="No aplica" disabled>`,{help:'Equipo nuevo: no aplica'})}</div>
      <div data-for="USADO">${fld('Traslado en el ERP',selH('i_tras',['NO REALIZADO','REALIZADO']),{help:'Por defecto NO REALIZADO'})}</div>
    </div>

    <div data-hide-ret>
      <div class="fsec">Datos de compra <span class="mut" id="i_comprahint">· obligatorios si el equipo es NUEVO, opcionales si es USADO</span></div>
      <div class="fg">
        ${fld('Proveedor <i class="rq">*</i>',mkCombo('i_prov','Buscar proveedor…'))}
        ${fld('NIT proveedor',`<input class="inp mono" id="i_nit" disabled placeholder="Se llena al elegir el proveedor">`)}
        ${fld('Fecha de la factura <i class="rq">*</i>',`<input type="date" class="inp" id="i_ffact" min="${MIN_FECHA}" max="${HOY}">`)}
        ${fld('Número de factura <i class="rq">*</i>',`<input class="inp mono" id="i_nfact" placeholder="Ej. HTFE-14609">`)}
        ${fld('Valor de compra (sin IVA)',`<input type="number" class="inp" id="i_vbase" min="0" step="1" placeholder="0">`)}
        ${fld('Valor de compra + IVA (19%) <i class="rq">*</i>',`<input type="number" class="inp" id="i_vtotal" min="0" step="1" placeholder="0"><div class="calc" id="i_vcalc"></div>`)}
      </div>

  <div class="mf"><span class="mut"><i style="color:var(--err);font-style:normal">*</i> obligatorio</span><div><button class="btn" data-close="form">Cancelar</button><button class="btn primary" id="i_ok">${ic('check')}Registrar ingreso</button></div></div>`);

  bindCombo('i_prov',()=>PROV_N,x=>{$('#i_nit').value=(PROV.find(p=>p.n===x)||{}).nit||''});
  $('#i_estado').addEventListener('change',()=>{$('#fbody').dataset.estado=$('#i_estado').value;clearErrs()});

  ['i_noserial','i_noactivo'].forEach(id=>$('#'+id).addEventListener('change',()=>{

  const vb=$('#i_vbase'),vt=$('#i_vtotal');
  const calc=()=>{const t=+vt.value;$('#i_vcalc').innerHTML=t>0?`Base <b>${fCOP(t/1.19)}</b> · IVA <b>${fCOP(t-t/1.19)}</b> · Total <b>${fCOP(t)}</b>`:''};
  vb.addEventListener('input',()=>{vt.value=vb.value?Math.round(+vb.value*1.19):'';calc()});
  vt.addEventListener('input',()=>{vb.value=vt.value?Math.round(+vt.value/1.19):'';calc()});
  $('#i_ok').onclick=submitIngreso;
  syncCant();
  if(r){
    $('#i_disp').value=r.dispositivo;$('#i_desc').value=r.descripcion;$('#i_serial').value=r.serial;$('#i_activo').value=r.activo;
    $('#i_noserial').checked=!r.serial;$('#i_noactivo').checked=!r.activo;$('#i_estado').value='USADO';

    syncCant();

}
function syncCant(){$('#f_cant').style.display=(!F.retorno&&$('#i_noserial').checked&&$('#i_noactivo').checked)?'':'none'}
function setEstado(x,lock){const el=$('#i_estado');el.value=x;el.disabled=lock;$('#fbody').dataset.estado=x}
function lockEq(m){if(!F.locked){$('#i_disp').value=m.dispositivo;$('#i_desc').value=m.descripcion}
  $('#i_disp').disabled=$('#i_desc').disabled=true;setEstado('USADO',true);$('#fbody').dataset.ret='1';F.locked=true}
function unlockEq(){if(F.locked){$('#i_disp').value='';$('#i_desc').value='';setEstado('',false)}$('#i_disp').disabled=$('#i_desc').disabled=false;delete $('#fbody').dataset.ret;F.locked=false}
function dupCheck(){
  if(F.retorno)return;
  const s=$('#i_noserial').checked?'':normK($('#i_serial').value),a=$('#i_noactivo').checked?'':normK($('#i_activo').value);
  let m=null,by='';
  if(s){m=equipos.find(e=>normK(e.serial)===s);if(m)by='serial'}
  if(!m&&a){m=equipos.find(e=>normK(e.activo)===a);if(m)by='activo'}
  F.match=m;F.matchBy=by;
  const box=$('#i_dup');
  if(!m){box.style.display='none';box.innerHTML='';if(F.locked)unlockEq();return}
  box.style.display='';
  const where=m.situacion==='BODEGA'?`en repisa <b>${esc(m.repisa)}</b>`:`con <b>${esc(m.usuario)}</b> · CC <b>${esc(m.ccAsignado)}</b>`;
  const d=`<b>${esc(m.dispositivo)}</b> · ${esc(m.descripcion)}<br>${sitB(m.situacion)} ${where}`;
  const link=` <a data-open-eq="${m.id}">Ver su historial →</a>`;
  if(m.situacion==='BODEGA'){box.innerHTML=alertH('err',`Este ${by} ya está en bodega: ${d}<br>No puede ingresar dos veces.${link}`);if(F.locked)unlockEq()}
  else{box.innerHTML=alertH('info',`Equipo encontrado por ${by}: ${d}<br>Se registrará como <b>retorno a bodega</b> del mismo equipo (USADO) y se conservará su historial.${link}`);lockEq(m)}
}
function submitIngreso(){
  clearErrs();let ok=true;const g=id=>$('#'+id).value.trim();
  const target=F.retorno||(F.match&&F.match.situacion!=='BODEGA'?F.match:null);
  const estado=target?'USADO':g('i_estado');
  const fecha=g('i_fecha');let e1=vFecha(fecha,MIN_FECHA,HOY);
  if(!e1&&target){const last=movById(target.ultMov).fecha;if(fecha<last)e1=`Es anterior a su último movimiento (${fF(last)})`}
  if(e1){err('i_fecha',e1);ok=false}
  if(!estado){err('i_estado','Selecciona NUEVO o USADO');ok=false}
  const repisa=g('i_repisa');if(!repisa){err('i_repisa','Selecciona la repisa');ok=false}
  let cant=1;const ns=$('#i_noserial').checked,na=$('#i_noactivo').checked;
  let prov=null;
  if(!target){
    const disp=g('i_disp');if(!DISPOSITIVOS.includes(disp)){err('i_disp',disp?'No está en el catálogo. Elige una opción de la lista.':'Obligatorio');ok=false}
    if(!g('i_desc')){err('i_desc','Obligatorio');ok=false}
    if(!ns&&!g('i_serial')){err('i_serial','Escribe el serial o marca "Sin serial"');ok=false}
    if(!na&&!g('i_activo')){err('i_activo','Escribe el activo o marca "Sin activo"');ok=false}
    if(ns&&na){cant=parseInt(g('i_cant'),10);if(!(cant>=1&&cant<=50)){err('i_cant','Entre 1 y 50');ok=false}}
    if(F.match){err(F.matchBy==='serial'?'i_serial':'i_activo','El equipo ya está en bodega');ok=false}
    /* datos de compra: obligatorios si es NUEVO; si es USADO solo se validan los que se llenen */
    const req=estado==='NUEVO';
    if(g('i_prov')||req){prov=PROV.find(p=>p.n===g('i_prov'));if(!prov){err('i_prov',g('i_prov')?'No está en el catálogo de proveedores':'Obligatorio para equipos nuevos');ok=false}}
    const ff=g('i_ffact');
    if(ff||req){const e2=vFecha(ff,MIN_FECHA,fecha&&!e1?fecha:HOY);if(e2){err('i_ffact',ff&&ff>fecha?'No puede ser posterior a la fecha de ingreso':e2);ok=false}}
    if(req&&!g('i_nfact')){err('i_nfact','Obligatorio para equipos nuevos');ok=false}
    if((g('i_vtotal')||req)&&!(+g('i_vtotal')>0)){err('i_vtotal','Escribe el valor (base o con IVA)');ok=false}
  }
  if(!ok){focusErr();return}

  const base={fecha,seguimiento:'INGRESO',origen:target?'RETORNO':'ALTA',repisa,traslado:estado==='NUEVO'?'NO APLICA':g('i_tras')};
  let last;
  if(target){registrarMov(target,base);last=target;toast(`Retorno registrado: <b>${esc(target.dispositivo)}</b> vuelve a bodega (repisa ${esc(repisa)})`)}
  else{
    const compra={proveedor:prov?prov.n:'',nit:prov?prov.nit:'',fechaFactura:g('i_ffact'),numFactura:g('i_nfact').toUpperCase(),valor:+g('i_vtotal')>0?Math.round(+g('i_vtotal')):null};
    for(let i=0;i<cant;i++){
      last=nuevoEquipo({dispositivo:g('i_disp'),descripcion:g('i_desc').toUpperCase(),serial:ns?'':g('i_serial').toUpperCase(),activo:na?'':g('i_activo'),estado,...compra});
      registrarMov(last,base);
    }
    toast(`${cant>1?cant+' equipos ingresados':'Ingreso registrado'}: <b>${esc(last.dispositivo)}</b> (${estado}) en repisa ${esc(repisa)} · <a data-open-eq="${last.id}">Ver</a>`);
  }
  closeModal('form');refresh(true);
}

/* ================= formulario: SALIDA / ASIGNACIÓN ================= */
const SEG_HINT={'SALIDA':'Entrega del equipo a un usuario y a un CC destino.','CONTINGENCIA BOD 72':'El equipo sale temporalmente por contingencia a la bodega 72. Cuando vuelva se registra como ingreso (USADO).','PRÉSTAMO':'Préstamo temporal. Cuando vuelva se registra como ingreso (USADO).','PRÉSTAMO BARRANCA':'Préstamo temporal a Barranca. Cuando vuelva se registra como ingreso (USADO).'};
function openSalida(pre=[]){
  F={kind:'sal',seg:'SALIDA',sel:new Set(pre)};
  openModal('form',`
  <div class="mh"><div><div class="mt">${ic('out')}Registrar salida / asignación</div><div class="ms">El equipo sale de bodega hacia un usuario y un CC destino</div></div><button class="x" data-close="form">${ic('x')}</button></div>
  <div class="mb">
    <div class="fsec">Tipo de movimiento (seguimiento)</div>
    <div class="seg" id="s_seg">${['SALIDA','CONTINGENCIA BOD 72','PRÉSTAMO','PRÉSTAMO BARRANCA'].map(x=>`<button type="button" data-v="${x}" class="${x==='SALIDA'?'on':''}">${x}</button>`).join('')}</div>
    <div class="hint" id="s_hint">${SEG_HINT.SALIDA}</div>
    <div class="fsec">Equipos <span class="mut" id="s_cnt"></span></div>
    <div class="f" id="f_eqs"><div class="srch big">${ic('search')}<input class="inp" id="s_q" placeholder="Buscar por serial, activo o descripción…" autocomplete="off"></div>
      <div class="chips-sel" id="s_chips"></div><div class="picker" id="s_list"></div>
      <div class="help">Solo se pueden elegir equipos que estén <b>en bodega</b>. Los demás se muestran deshabilitados para evitar salidas duplicadas.</div><div class="err"></div></div>
    <div class="fsec">Destino</div>
    <div class="fg">
      ${fld('Usuario',mkCombo('s_user','Buscar usuario…'),{req:1})}
      ${fld('CC asignado',mkCombo('s_cc','Buscar CC…'),{req:1})}
      ${fld('Fecha del movimiento',`<input type="date" class="inp" id="s_fecha" value="${HOY}" min="${MIN_FECHA}" max="${HOY}">`,{req:1})}
      ${fld('Fecha de envío',`<input type="date" class="inp" id="s_fenv" value="${HOY}" min="${MIN_FECHA}" max="${MAX_ENVIO}">`,{req:1,help:'No puede ser anterior al movimiento ni más de 30 días en el futuro'})}
      ${fld('Traslado en el ERP',selH('s_tras',['NO REALIZADO','REALIZADO']),{help:'Por defecto NO REALIZADO. Se puede marcar después en "Traslados ERP".'})}
    </div>
  </div>
  <div class="mf"><span class="mut"><i style="color:var(--err);font-style:normal">*</i> obligatorio</span><div><button class="btn" data-close="form">Cancelar</button><button class="btn primary" id="s_ok">${ic('check')}<span id="s_oklbl">Registrar salida</span></button></div></div>`);
  bindCombo('s_user',()=>USUARIOS);
  bindCombo('s_cc',()=>CCS);
  $$('#s_seg button').forEach(b=>b.onclick=()=>{F.seg=b.dataset.v;$$('#s_seg button').forEach(x=>x.classList.toggle('on',x===b));$('#s_hint').textContent=SEG_HINT[F.seg];$('#s_oklbl').textContent=F.seg==='SALIDA'?'Registrar salida':'Registrar '+F.seg.toLowerCase()});
  $('#s_q').addEventListener('input',drawPicker);
  $('#s_list').addEventListener('change',ev=>{const c=ev.target.closest('[data-pk]');if(!c)return;const id=+c.dataset.pk;c.checked?F.sel.add(id):F.sel.delete(id);$('#f_eqs').classList.remove('bad');drawPicker()});
  $('#s_chips').addEventListener('click',ev=>{const b=ev.target.closest('[data-unpk]');if(b){F.sel.delete(+b.dataset.unpk);drawPicker()}});
  $('#s_ok').onclick=submitSalida;

function drawPicker(){
  const q=$('#s_q').value.trim().toLowerCase();
  let l=equipos.filter(e=>txtMatch(e,q)).sort((a,b)=>(a.situacion==='BODEGA'?0:1)-(b.situacion==='BODEGA'?0:1)||b.id-a.id);
  const tot=l.length;l=l.slice(0,60);
  $('#s_list').innerHTML=l.map(e=>{const dis=e.situacion!=='BODEGA',on=F.sel.has(e.id);
    return `<label class="pk${dis?' dis':''}${on?' on':''}"><input type="checkbox" data-pk="${e.id}" ${on?'checked':''} ${dis?'disabled':''}>
      <span class="pk-d" title="${esc(e.dispositivo)}">${esc(e.dispositivo)}</span><span class="mono">${e.serial?esc(e.serial):'<span class="dash">sin serial</span>'}</span>
      <span>${e.activo?'Act. '+esc(e.activo):'<span class="dash">sin activo</span>'}</span><span class="pk-x" title="${esc(e.descripcion)}">${esc(e.descripcion)}</span>
      <span class="pk-r">${dis?`${sitB(e.situacion)} ${esc(e.usuario)} · CC ${esc(e.ccAsignado)}`:`Repisa ${esc(e.repisa)}`}</span></label>`}).join('')
    +(tot>60?`<div class="pk-more">Mostrando 60 de ${tot}. Afina la búsqueda.</div>`:'')||'<div class="pk-more">Sin resultados</div>';
  $('#s_chips').innerHTML=[...F.sel].map(id=>{const e=eqById(id);return `<span class="cs">${esc(e.dispositivo)} · ${esc(e.serial||(e.activo?'Act. '+e.activo:e.cod))}<button data-unpk="${id}" title="Quitar">${ic('x')}</button></span>`}).join('');
  $('#s_cnt').textContent=F.sel.size?`· ${F.sel.size} seleccionado${F.sel.size>1?'s':''}`:'';
}
function submitSalida(){
  clearErrs();let ok=true;
  const us=$('#s_user').value.trim(),cc=$('#s_cc').value.trim(),f=$('#s_fecha').value,fe=$('#s_fenv').value,tr=$('#s_tras').value;
  const sel=[...F.sel].map(eqById);
  if(!sel.length){err('f_eqs','Selecciona al menos un equipo que esté en bodega');ok=false}
  if(!USUARIOS.includes(us)){err('s_user',us?'El usuario no está en el catálogo':'Obligatorio');ok=false}
  if(!CCS.includes(cc)){err('s_cc',cc?'El CC no está en el catálogo':'Obligatorio');ok=false}
  else if(cc==='963'){err('s_cc','El CC destino no puede ser la misma bodega 963');ok=false}
  let ef=vFecha(f,MIN_FECHA,HOY);
  if(!ef&&sel.length){const mx=sel.reduce((a,e)=>e.fechaIngreso>a?e.fechaIngreso:a,'');if(f<mx)ef=`Es anterior al ingreso del equipo a bodega (${fF(mx)})`}
  if(ef){err('s_fecha',ef);ok=false}
  let ee=vFecha(fe,MIN_FECHA,MAX_ENVIO);if(!ee&&f&&fe<f)ee='No puede ser anterior a la fecha del movimiento';
  if(ee){err('s_fenv',ee);ok=false}
  if(!ok){focusErr();return}
  sel.forEach(e=>registrarMov(e,{fecha:f,seguimiento:F.seg,usuario:us,ccAsignado:cc,fechaEnvio:fe,traslado:tr}));
  ui.invSel.clear();
  toast(`${F.seg}: <b>${sel.length}</b> equipo${sel.length>1?'s':''} a <b>${esc(us)}</b> · CC ${esc(cc)}${tr==='NO REALIZADO'?' · traslado pendiente':''}`);
  closeModal('form');refresh(true);
}

/* ================= panel lateral: trazabilidad ================= */
function openEquipo(id){ui.drawer=id;drawDrawer();$('#drawer').classList.add('open');$('#drw-ov').classList.add('open')}
function closeDrawer(){ui.drawer=null;$('#drawer').classList.remove('open');$('#drw-ov').classList.remove('open')}
function tlTxt(m){
  if(m.seguimiento==='INGRESO')return m.origen==='RETORNO'?['Volvió a bodega',`Quedó en repisa ${m.repisa} · USADO`]:[`Ingresó a bodega (${m.estado})`,`Repisa ${m.repisa}`];
  const t={'SALIDA':`Salió al CC ${m.ccAsignado}`,'CONTINGENCIA BOD 72':`Contingencia BOD 72 · CC ${m.ccAsignado}`,'PRÉSTAMO':`Préstamo al CC ${m.ccAsignado}`,'PRÉSTAMO BARRANCA':`Préstamo Barranca · CC ${m.ccAsignado}`}[m.seguimiento];
  return [t,`Usuario: ${m.usuario} · envío ${fF(m.fechaEnvio)}${m.repisa?` · salió de repisa ${m.repisa}`:''}`];
}
function drawDrawer(){
  const e=eqById(ui.drawer);if(!e)return;
  const ms=movsDe(e.id),last=ms[0],pend=last.traslado==='NO REALIZADO';
  const kv=(k,x,c='')=>`<div class="${c}"><div class="k">${k}</div><div class="v">${x}</div></div>`;
  const now=e.situacion==='BODEGA'
    ?`<div class="now c-info">${ic('pin')}<div>En bodega 963 · <b>repisa ${esc(e.repisa)}</b><br><span class="mut">Desde ${fF(e.fechaIngreso)}</span></div></div>`
    :`<div class="now c-${SIT[e.situacion].c}">${ic('user')}<div>${SIT[e.situacion].l} a <b>${esc(e.usuario)}</b> · CC <b>${esc(e.ccAsignado)}</b><br><span class="mut">Enviado el ${fF(e.fechaEnvio)} · ${esc(last.seguimiento)}</span></div></div>`;
  $('#drawer').innerHTML=`
  <div class="dh"><div><div class="eyebrow">Trazabilidad del equipo · ${e.cod}</div><h2>${esc(e.dispositivo)}</h2><p>${esc(e.descripcion)}</p>
    <div class="tags">${sitB(e.situacion)}${estB(e.estado)}${pend?'<span class="bd b-warn">Traslado pendiente</span>':''}</div></div>
    <button class="x" data-close-drawer>${ic('x')}</button></div>
  <div class="db">
    ${now}
    <div class="fsec">Identificación</div>
    <div class="kv">${kv('Serial',e.serial?`<span class="mono">${esc(e.serial)}</span>`:DASH)}${kv('Activo',v(e.activo))}${kv('Estado',esc(e.estado))}</div>
    <div class="fsec">Datos de compra</div>
    ${e.proveedor?`<div class="kv">${kv('Proveedor',esc(e.proveedor),'wide')}${kv('NIT',`<span class="mono">${esc(e.nit)}</span>`)}${kv('N° factura',esc(e.numFactura))}${kv('Fecha factura',fF(e.fechaFactura))}${kv('Valor + IVA (19%)',fCOP(e.valor),'wide')}</div>`
      :`<div class="now">${ic('info')}<div class="mut">Sin datos de factura registrados.</div></div>`}
    <div class="d-act">
      ${e.situacion==='BODEGA'?`<button class="btn primary sm" data-act="d-salida" data-id="${e.id}">${ic('out')}Registrar salida</button>`
        :`<button class="btn primary sm" data-act="d-retorno" data-id="${e.id}">${ic('back')}Registrar retorno a bodega</button>`}
      ${pend?`<button class="btn sm ok" data-tras-one="${last.id}">${ic('check')}Marcar traslado REALIZADO</button>`:''}
    </div>
    <div class="fsec">Movimientos <span class="mut">· ${ms.length} · del más reciente al más antiguo</span></div>
    <ol class="tl">${ms.map((m,i)=>{const [t,s]=tlTxt(m),a=m.audit[0];return `<li class="tl-i c-${SEG_C[m.seguimiento]} ${i===0?'first':''}" data-open-mov="${m.id}"><div class="tl-dot"></div><div class="tl-b">
      <div class="tl-top"><span class="tl-d">${fF(m.fecha)}</span>${segB(m.seguimiento,m.origen)}${m.traslado!=='NO APLICA'?trasB(m.traslado):''}</div>
      <div class="tl-t">${esc(t)}</div><div class="tl-s">${esc(s)}</div><div class="tl-a">${ic('shield')}Registró ${esc(a.por)} · ${esc(a.ts)}</div></div></li>`}).join('')}</ol>
  </div>`;
}

/* ================= detalle del movimiento + auditoría ================= */
function openMov(id){
  const m=movById(id),e=eqById(m.equipoId);
  const rows=[['FECHA',fF(m.fecha)],['SEGUIMIENTO',segB(m.seguimiento,m.origen)],['ESTADO',esc(m.estado)],['DISPOSITIVO',esc(e.dispositivo)],
    ['SERIAL',e.serial?`<span class="mono">${esc(e.serial)}</span>`:DASH],['ACTIVO',v(e.activo)],['DESCRIPCION',esc(e.descripcion),'wide'],['NUMERO DE REPISA',v(m.repisa)],
    ['NIT PROVEEDOR',v(e.nit)],['PROVEEDOR',v(e.proveedor)],['FECHA DE LA FACTURA',fF(e.fechaFactura)||DASH],['NUMERO DE FACTURA',v(e.numFactura)],['VALOR DE COMPRA + IVA (19%)',e.valor?fCOP(e.valor):DASH],
    ['USUARIO',v(m.usuario)],['CC ASIGNADO',v(m.ccAsignado)],['FECHA DE ENVIO',fF(m.fechaEnvio)||DASH],['TRASLADO',trasB(m.traslado),'wide']];
  openModal('det',`
  <div class="mh"><div><div class="mt">${ic('hist')}Movimiento #${m.id} · ${esc(m.seguimiento)}</div><div class="ms">${esc(e.dispositivo)} · ${esc(e.serial||e.activo||e.cod)}</div></div><button class="x" data-close="det">${ic('x')}</button></div>
  <div class="mb">
    <div class="fsec">Campos del movimiento</div>
    <div class="kv">${rows.map(([k,x,c])=>`<div class="${c||''}"><div class="k">${k}</div><div class="v">${x}</div></div>`).join('')}</div>
    <div class="fsec">Auditoría</div>
    <ul class="audit">${m.audit.map(a=>`<li>${ic(a.i||'shield')}<span class="t">${esc(a.ts)}</span><b>${esc(a.por)}</b><span>${esc(a.acc)}</span></li>`).join('')}</ul>
  </div>
  <div class="mf"><button class="btn sm" data-act="m-eq" data-id="${e.id}">${ic('eye')}Ver trazabilidad del equipo</button><div>
    ${m.traslado==='NO REALIZADO'?`<button class="btn sm ok" data-act="m-tras" data-id="${m.id}">${ic('check')}Marcar traslado REALIZADO</button>`:''}
    <button class="btn sm" data-close="det">Cerrar</button></div></div>`);
}
function confirmTras(ids){
  ids=ids.filter(id=>movById(id)?.traslado==='NO REALIZADO');
  if(!ids.length){toast('No hay traslados pendientes en la selección','warn');return}
  openModal('det',`
  <div class="mh"><div class="mt">${ic('truck')}Marcar traslado como REALIZADO</div><button class="x" data-close="det">${ic('x')}</button></div>
  <div class="mb"><p style="margin-top:14px;line-height:1.5">Se marcarán <b>${ids.length}</b> movimiento${ids.length>1?'s':''} como <b>REALIZADO</b> en el ERP. Quedará en la auditoría de cada uno a nombre de <b>${USUARIO_ACTUAL}</b>.</p>
    <ul class="mini">${ids.map(id=>{const m=movById(id),e=eqById(m.equipoId);return `<li>${segB(m.seguimiento)}<span class="dv">${esc(e.dispositivo)}</span><span class="mono mut">${esc(e.serial||e.activo||e.cod)}</span><span class="mut">${m.seguimiento==='INGRESO'?'retorno a bodega':'→ CC '+esc(m.ccAsignado)+' · '+esc(m.usuario)}</span></li>`}).join('')}</ul></div>
  <div class="mf"><span></span><div><button class="btn" data-close="det">Cancelar</button><button class="btn primary" id="c_ok">${ic('check')}Confirmar</button></div></div>`);
  $('#c_ok').onclick=()=>{const n=marcarTraslados(ids);closeModal('det');toast(`${n} traslado${n>1?'s':''} marcado${n>1?'s':''} como REALIZADO`);refresh(ui.tab==='tras')};
}

/* ================= eventos ================= */
document.addEventListener('click',ev=>{
  const t=ev.target;let el;
  if((el=t.closest('[data-tab]'))){ui.tab=el.dataset.tab;render();return}
  if((el=t.closest('[data-close]'))){closeModal(el.dataset.close);return}
  if(t.closest('[data-close-drawer]')||t.id==='drw-ov'){closeDrawer();return}
  if(t.classList.contains('ov')&&t.id==='ov-det'){closeModal('det');return}
  if((el=t.closest('[data-open-eq]'))){ev.preventDefault();openEquipo(+el.dataset.openEq);return}
  if((el=t.closest('[data-tras-one]'))){const n=marcarTraslados([+el.dataset.trasOne]);if(n)toast('Traslado marcado como REALIZADO');refresh(ui.tab==='tras');return}
  if((el=t.closest('[data-open-mov]'))){openMov(+el.dataset.openMov);return}
  if((el=t.closest('[data-chip]'))){ui.inv.sit=el.dataset.chip;ui.invSel.clear();drawInv();return}
  if(t.closest('[data-chip-tras]')){ui.inv.traslado=ui.inv.traslado==='NO REALIZADO'?'':'NO REALIZADO';render();return}
  if((el=t.closest('[data-tmodo]'))){ui.tras.modo=el.dataset.tmodo;ui.trasSel.clear();render();return}
  if((el=t.closest('[data-bulk]'))){
    const b=el.dataset.bulk,sc=el.dataset.scope;
    if(b==='clear'){ui[sc+'Sel'].clear();VIEWS[ui.tab][1]()}
    else if(b==='entregar'){const all=[...ui.invSel],ok=all.filter(id=>eqById(id).situacion==='BODEGA');
      if(ok.length<all.length)toast(`${all.length-ok.length} equipo(s) no están en bodega y no se incluyen`,'warn');openSalida(ok)}
    else if(b==='tras'){const ids=sc==='inv'?[...ui.invSel].map(id=>eqById(id).ultMov):[...ui[sc+'Sel']];confirmTras(ids)}
    return;
  }
  if((el=t.closest('[data-act]'))){
    const a=el.dataset.act,id=+el.dataset.id;
    if(a==='ingreso')openIngreso();
    else if(a==='salida')openSalida();
    else if(a==='clear'){ui[el.dataset.scope]={...EMPTY[el.dataset.scope],...(el.dataset.scope==='tras'?{modo:ui.tras.modo}:{})};render()}
    else if(a==='hist-pend'){ui.hist.traslado=ui.hist.traslado==='NO REALIZADO'?'':'NO REALIZADO';render()}
    else if(a==='d-salida'){closeDrawer();openSalida([id])}
    else if(a==='d-retorno'){closeDrawer();openIngreso({retornoDe:id})}
    else if(a==='m-eq'){closeModal('det');openEquipo(id)}
    else if(a==='m-tras'){marcarTraslados([id]);toast('Traslado marcado como REALIZADO');refresh(ui.tab==='tras');openMov(id)}
    return;
  }
  const row=t.closest('#tbl tbody tr');
  if(row&&!t.closest('input,button,a,label')){if(row.dataset.eq)openEquipo(+row.dataset.eq);else if(row.dataset.mov)openMov(+row.dataset.mov)}
});
document.addEventListener('input',ev=>{
  const el=ev.target;if(!el.dataset.f||!el.closest('#content'))return;
  ui[el.dataset.scope][el.dataset.f]=el.value;ui[el.dataset.scope+'Sel'].clear();VIEWS[ui.tab][1]();
});
document.addEventListener('change',ev=>{
  const el=ev.target;
  if(el.dataset.sel){const S=ui[el.dataset.sel+'Sel'],id=+el.value;el.checked?S.add(id):S.delete(id);VIEWS[ui.tab][1]()}
  else if(el.dataset.all){const sc=el.dataset.all,S=ui[sc+'Sel'];const list=sc==='inv'?filtInv():sc==='hist'?filtHist():filtTras();
    list.forEach(x=>el.checked?S.add(x.id):S.delete(x.id));VIEWS[ui.tab][1]()}
});
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Escape')return;
  if($('#ov-det').classList.contains('open'))closeModal('det');
  else if(ui.drawer)closeDrawer();
  else if($('#ov-form').classList.contains('open'))closeModal('form');
});

/* ================= init ================= */
seed();drawSidebar();render();
</script>
</body>
</html>
